version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: sawaliram
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${sawaliram_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    restart: always

  web:
    build: .
    command: gunicorn core.wsgi --bind 0.0.0.0:8000 --log-file -
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq
    restart: always

  celery:
    build: .
    command: celery -A core worker -l info
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq
    restart: always

volumes:
  postgres_data: 